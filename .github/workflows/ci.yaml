name: CI

on:
  # A hand-run, so a branch can be checked without a push that changes it. GitHub offers the button
  # once this file is on the default branch, and the branch it runs is chosen when it is started.
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "scripts/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".rustfmt.toml"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "scripts/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".rustfmt.toml"
      - ".github/workflows/ci.yaml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Installed before stable so stable stays the default; `.rustfmt.toml` needs unstable options.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lint-${{ matrix.os }}

      - name: Check formatting
        run: cargo +nightly fmt --check

      - name: Install cargo-sort
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-sort

      - name: Check dependency ordering
        run: cargo sort -c -w

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --document-private-items

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      # The gate and shell tests spawn Windows PowerShell, and its first start on a fresh runner
      # has taken over a minute, which the first such test then pays inside its own budget. `run`
      # steps use pwsh, so nothing else warms `powershell.exe` before the suite does.
      - name: Warm Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: Write-Output warm

      - name: Run tests
        run: cargo test --locked --features mock-provider

  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv

      - name: Check that the declared MSRV still builds
        run: cargo check --locked --all-targets

  # The FreeBSD legs are `cfg(target_os = "freebsd")` and reach no other runner: the jailbroker
  # client, the capability probe and the shell tool's branch for it are all FreeBSD-only, so
  # nothing above builds them. Formatting and dependency order are not repeated here, since the
  # lint job checks the same sources.
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build, lint and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # At 4096 the VM is killed part-way through the build, with no compiler output and only a
          # SIGKILL to show for it; the dependency tree needs the headroom.
          mem: 8192
          # The guest's `target/` directory is several gigabytes and nothing after this step reads
          # it, so syncing the workspace back to the runner is pure cost.
          copyback: false
          prepare: |
            # The guest is sized from this host unless `cpu` is given, so the number is worth
            # having in the log rather than inferred.
            sysctl -n hw.ncpu
            # python3 is what the MCP test fixtures are written in, and the VM carries none.
            pkg install -y curl ca_root_nss python3
            # The toolchain goes where both the installer (root) and the builder below can reach it.
            mkdir -p /opt/cargo /opt/rustup
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup \
              sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable --component clippy
            # The suite runs as a user here, as it does on the other three platforms. Two of its
            # checks are about what a user may not do (delete a file it has no right to, own the
            # socket only root could have put there) and this VM's shell is root, for which both
            # hold, so as root they cannot express their premise at all.
            pw useradd -n builder -m -s /bin/sh
            chown -R builder /opt/cargo /opt/rustup /home/runner/work
          run: |
            su -l builder -c 'export CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup
            export PATH=/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
            # A build that starts from an empty target directory gains nothing from incremental
            # compilation but writes its cache anyway, and debug info is most of what codegen and
            # linking put on this disk. Both are off: a failing assertion still prints its message
            # and location, and only the backtrace is poorer.
            export CARGO_INCREMENTAL=0
            export CARGO_PROFILE_TEST_DEBUG=0
            cd /home/runner/work/meka/meka || cd /github/workspace
            cargo clippy --locked --all-targets -- -D warnings
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --document-private-items
            # Every test target is built once, before any of them runs, so the two runs below
            # measure the suite rather than the compiler.
            cargo test --locked --features mock-provider --no-run
            # Everything but the PTY suite, in parallel: this is where the time goes otherwise,
            # and these suites wait on child processes rather than on a core.
            cargo test --locked --features mock-provider --bins --test acp --test cli --test layering --test multiprocess --test serve
            # The PTY suite, one test at a time: it drives a whole meka per test and reads the rows
            # it has drawn, and under the load of this VM a row can be missing when it looks.
            # Serially it passes, so a parallel failure here reports the harness timing rather than
            # the code under it.
            cargo test --locked --features mock-provider --test repl_pty -- --test-threads=1'

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mdBook
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: mdbook@0.5.4

      - name: Build the book
        run: mdbook build docs/book
