name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

env:
  # The Windows binary links the C runtime statically, so it starts on a machine without the
  # Visual C++ Redistributable. Named for the one target, so the other builds ignore it; `ci.yaml`
  # sets the same, so the suite runs on the linkage that ships.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  wsl-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-unknown-linux-musl
      - name: Build the Linux WSL payloads
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # The runner runs the guest's commands and the loader deploys it on demand. A Windows
          # build carries both or neither, so both come out of this one musl build.
          cargo build --locked --release --target x86_64-unknown-linux-musl \
            --bin meka --bin meka-wsl-loader
          cp target/x86_64-unknown-linux-musl/release/meka meka-runner
          cp target/x86_64-unknown-linux-musl/release/meka-wsl-loader meka-wsl-loader
          # The guest runs the runner from a sealed memory file and the loader from an unlinked
          # temporary file, so an INTERP program header would name a loader path neither can
          # supply. The build script bounds each payload's size; these are the bytes it embeds.
          for payload in meka-runner meka-wsl-loader; do
            readelf -l "$payload" > "$payload-program-headers.txt"
            if grep -q INTERP "$payload-program-headers.txt"; then
              echo "$payload must not need a distro-specific loader" >&2
              exit 1
            fi
            ls -l "$payload"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-runner-payload
          path: |
            meka-runner
            meka-wsl-loader

  build:
    needs: wsl-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: meka-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: meka-windows-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: meka-macos-arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    env:
      BUILD_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.profile == 'release') && 'release' || 'debug' }}
      CARGO_FLAGS: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.profile == 'release') && '--release' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Download WSL payloads
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: wsl-runner-payload
          path: wsl-payload

      - name: Select the bundled WSL payloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "MEKA_WSL_RUNNER=$((Resolve-Path wsl-payload/meka-runner).Path)" >> $env:GITHUB_ENV
          "MEKA_WSL_LOADER=$((Resolve-Path wsl-payload/meka-wsl-loader).Path)" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --locked ${{ env.CARGO_FLAGS }} --target ${{ matrix.target }}

      - name: Package artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/${{ env.BUILD_PROFILE }}/meka staging/
          tar -czf ${{ matrix.artifact }}.tar.gz -C staging .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/${{ env.BUILD_PROFILE }}/meka.exe" staging/
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: meka-*
          merge-multiple: true

      - name: Extract the changelog section for this version
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          # Take the body of "## [<version>]" up to the next "## [" heading, trimming blank lines.
          # index()==1 is a literal prefix match, so 0.34.0 cannot match 0.34.01.
          notes="$(
            awk -v ver="$version" '
              BEGIN { prefix = "## [" ver "]" }
              index($0, prefix) == 1 { grab = 1; next }
              grab && /^## \[/ { exit }
              grab { print }
            ' CHANGELOG.md | sed '/./,$!d' | tac | sed '/./,$!d' | tac
          )"
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG.md section found for '## [$version]' — add it before tagging."
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md
          echo "--- release notes for $version ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*
